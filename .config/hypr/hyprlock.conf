source = ~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $background_image
    color = $background_color
    blur_size = 6
    blur_passes = 2
    noise = 0.011
    contrast = 0.9
    brightness = 0.72
    vibrancy = 0.16
    vibrancy_darkness = 0.05
    crossfade_time = 0.3
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 6, smooth
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_family = $font_family_clock
    font_size = 72
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow_color
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext_color
    font_family = $font_family
    font_size = 18
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $shadow_color
}

input-field {
    monitor =
    size = 420, 64
    position = 0, -75
    halign = center
    valign = center

    inner_color = $entry_background_color
    outer_color = $entry_border_color
    check_color = $entry_check_color
    fail_color = $entry_fail_color
    capslock_color = $entry_capslock_color
    outline_thickness = 3

    font_family = $font_family
    font_color = $entry_color

    placeholder_text = Password
    check_text = Checking...
    fail_text = $PAMFAIL

    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    rounding = -1
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $shadow_color
    fade_on_empty = false
}
